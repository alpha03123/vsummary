[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vsummary-core"
version = "0.5.0a21"
description = "Public Core contracts and services for VSummary"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "alembic>=1.14,<2",
    "anyio>=4,<5",
    "chaoxing-downloader==0.1.3",
    "dashscope>=1.24,<2",
    "DrissionPage>=4.1,<5",
    "faster-whisper>=1.1,<2",
    "fastapi>=0.115,<1",
    "filelock>=3.16,<4",
    "huggingface-hub>=0.24,<1",
    "httpx>=0.27,<1",
    "langgraph>=0.3,<1",
    "lancedb>=0.24,<1",
    "llama-index-core>=0.12,<1",
    "llama-index-vector-stores-lancedb>=0.4,<1",
    "litellm==1.74.0",
    "markdown-it-py>=3,<4",
    "mcp>=1.9,<2",
    "opencc-python-reimplemented>=0.1,<1",
    "pandas>=2.2,<3",
    "pillow>=11,<12",
    "pydantic>=2,<3",
    "PyMySQL>=1.1,<2",
    "python-multipart>=0.0.18,<1",
    "SQLAlchemy>=2.0.36,<3",
    "srt>=3.5,<4",
    "yt-dlp>=2024.1,<2027",
]

[project.optional-dependencies]
cpu = [
    "fastembed>=0.7,<1",
    "onnxruntime>=1.20,<2",
]
gpu = [
    "fastembed-gpu>=0.7,<1",
    "onnxruntime-gpu>=1.20,<1.27",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "backend.agent*",
    "backend.agent_graph*",
    "backend.api*",
    "backend.bilibili*",
    "backend.chaoxing*",
    "backend.core*",
    "backend.external*",
    "backend.mcp*",
    "backend.shared*",
    "backend.video_summary*",
]
exclude = ["backend.local*"]

[tool.setuptools.package-data]
"backend.video_summary.infrastructure.persistence.migrations" = ["*.py", "versions/*.py"]
