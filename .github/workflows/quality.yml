name: Quality

on:
  pull_request:
  push:
    branches: [main, feature/**, fix/**]

jobs:
  backend:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - shell: pwsh
        run: python -m pip install -r requirements.cpu.txt -r requirements.dev.txt import-linter pytest
      - shell: pwsh
        run: $env:PYTHONPATH = 'src;.'; lint-imports
      - shell: pwsh
        run: $env:PYTHONPATH = 'src;.'; python -m pytest tests/backend -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run verify:workspace-ui-boundary
      - run: npm run build:workspace-ui

  macos-core:
    name: macOS Portable Core
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.cpu.txt -r requirements.dev.txt pytest
      - run: >-
          PYTHONPATH=src:. python -m pytest
          tests/backend/unit/agent
          tests/backend/unit/agent_graph
          tests/backend/unit/agent_memory
          tests/backend/unit/asr
          tests/backend/unit/bilibili
          tests/backend/unit/chaoxing
          tests/backend/unit/external
          tests/backend/unit/generation
          tests/backend/unit/infrastructure
          tests/backend/unit/library
          tests/backend/unit/llm
          tests/backend/unit/mcp
          tests/backend/unit/mindmap
          tests/backend/unit/settings
          tests/backend/unit/shared
          tests/backend/unit/updater
          tests/backend/unit/workspace
          tests/backend/unit/persistence/test_job_worker_contract.py
          tests/backend/unit/persistence/test_outbox_worker.py
          tests/backend/unit/persistence/test_sql_workspace_boundary.py
          -q
