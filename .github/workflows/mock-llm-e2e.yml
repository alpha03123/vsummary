name: Mock LLM E2E

on:
  pull_request:
  push:

jobs:
  mock-llm-e2e:
    name: Windows Local Mock LLM E2E
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime dependencies
        shell: pwsh
        run: |
          choco install mysql --no-progress --yes
          choco install ffmpeg --no-progress --yes
          python -m pip install -r requirements.cpu.txt -r requirements.dev.txt
      - name: Restore RAG embedding cache
        uses: actions/cache@v4
        with:
          path: temp/mock-llm-e2e/runtime/data/models/fastembed
          key: rag-embedding-${{ runner.os }}-bge-small-zh-v1.5-v1
      - name: Locate MySQL runtime
        shell: pwsh
        run: |
          $mysql = Get-ChildItem 'C:\Program Files\MySQL' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if ($null -eq $mysql) { throw 'MySQL installation was not found.' }
          "VSUMMARY_MYSQL_HOME=$($mysql.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run strict Mock Provider, backend, and E2E
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force temp/mock-llm-e2e | Out-Null
          python tools/mock_llm_e2e.py --mysql-home "$env:VSUMMARY_MYSQL_HOME" --runtime-root temp/mock-llm-e2e/runtime 2>&1 | Tee-Object -FilePath temp/mock-llm-e2e/run.log
          exit $LASTEXITCODE
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-llm-e2e-diagnostics
          path: |
            temp/mock-llm-e2e/latest.json
            temp/mock-llm-e2e/run.log
            temp/mock-llm-e2e/runtime/media.log
            temp/mock-llm-e2e/runtime/logs
