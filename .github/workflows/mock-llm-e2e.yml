name: Mock LLM E2E

on:
  pull_request:
  push:
    branches: [main, feature/**, fix/**]

jobs:
  mock-llm-e2e:
    name: Windows Local Mock LLM E2E
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime dependencies
        shell: pwsh
        run: |
          choco install mysql --no-progress --yes
          choco install ffmpeg --no-progress --yes
          python -m pip install -r requirements.cpu.txt -r requirements.dev.txt
      - name: Restore RAG embedding cache
        uses: actions/cache@v4
        with:
          path: data/models/fastembed
          key: rag-embedding-${{ runner.os }}-bge-small-zh-v1.5-v1
      - name: Configure CI runtime
        shell: pwsh
        run: |
          @(
            'OPENAI_API_KEY=ci-test-key'
            'OPENAI_PROVIDER=openai_compatible'
            'OPENAI_BASE_URL=http://127.0.0.1:8899'
            'OPENAI_MODEL=ci-e2e-model'
          ) | Set-Content .env
          Copy-Item config/settings.toml.example config/settings.toml
          (Get-Content config/settings.toml) -replace 'device = "gpu"', 'device = "cpu"' -replace 'chapter_visual_mode = "screenshots"', 'chapter_visual_mode = "off"' -replace 'note_visual_mode = "screenshots"', 'note_visual_mode = "off"' | Set-Content config/settings.toml
          $mysql = Get-ChildItem 'C:\Program Files\MySQL' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if ($null -eq $mysql) { throw 'MySQL installation was not found.' }
          "VSUMMARY_MYSQL_HOME=$($mysql.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run strict Mock Provider, backend, and E2E
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force temp/ci-mysql, temp/mock-llm-e2e | Out-Null
          $env:PYTHONPATH = 'src;.'
          $provider = Start-Process python -ArgumentList 'tools/mock_openai_provider.py --port 8899' -PassThru -RedirectStandardOutput temp/mock-provider.out.log -RedirectStandardError temp/mock-provider.err.log
          $dataRoot = (Resolve-Path temp/ci-mysql).Path
          $arguments = "-m backend.local.http.server --host 127.0.0.1 --port 8001 --managed-mysql-home `"$env:VSUMMARY_MYSQL_HOME`" --managed-data-root `"$dataRoot`" --skip-legacy-import"
          $backend = Start-Process python -ArgumentList $arguments -PassThru -RedirectStandardOutput temp/backend.out.log -RedirectStandardError temp/backend.err.log
          try {
            $deadline = (Get-Date).AddMinutes(3)
            while ((Get-Date) -lt $deadline) {
              try { if ((Invoke-WebRequest http://127.0.0.1:8001/api/health -UseBasicParsing).StatusCode -eq 200) { break } } catch {}
              Start-Sleep -Seconds 2
            }
            if ($backend.HasExited) { throw "Backend exited before becoming healthy with code $($backend.ExitCode)." }
            if ((Invoke-WebRequest http://127.0.0.1:8001/api/health -UseBasicParsing).StatusCode -ne 200) { throw 'Backend did not become healthy.' }
            ./tools/create_mock_llm_e2e_media.ps1 -OutputPath temp/mock-llm-e2e/fixture.mp4
            python tools/mock_llm_e2e.py --source-path temp/mock-llm-e2e/fixture.mp4
          } finally {
            foreach ($process in @($backend, $provider)) {
              if ($null -ne $process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            }
          }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-llm-e2e-diagnostics
          path: |
            temp/mock-llm-e2e
            temp/backend.*.log
            temp/mock-provider.*.log
