name: vsummary
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - ffmpeg
  - pip
  - pip:
    - -r requirements.gpu.txt
    - nvidia-cublas-cu12 
    - nvidia-cufft-cu12
    - nvidia-curand-cu12
    - nvidia-cuda-runtime-cu12
    - nvidia-cuda-nvrtc-cu12
    - nvidia-cudnn-cu12
