[asr]
provider = "faster_whisper"
language = "auto"
transcript_enhancement_enabled = false

[asr.faster_whisper]
device = "gpu"
model_size = "large-v3-turbo"
compute_type = "float16"
transcription_mode = "accurate"
initial_prompt = "以下为简体中文普通话转写文本。"

[asr.whisper_cpp]
binary_path = "whisper-cli"
model = "large-v3-turbo-q5_0"

[asr.aliyun_bailian]
base_url = "https://dashscope.aliyuncs.com"
model = "paraformer-v2"

[workspace_ui]
theme = "light"
show_takeaways = true

[debug]
mode = true

[agent_context]
window_tokens = 1000000
answer_detail_level = "medium"
reasoning_effort = "high"
talk_custom_prompt = ""

[agent_context.advanced]
reserved_output_tokens = 20000
warning_threshold_ratio = 0.6
compact_threshold_ratio = 0.8
blocking_threshold_ratio = 0.92
keep_tail_messages = 6
projection_max_tokens_ratio = 0.08
direct_summary_threshold_ratio = 0.9
planner_transport = "structured"

[agent_retrieval]
embedding_provider = "fastembed"
embedding_model = "BAAI/bge-small-zh-v1.5"
embedding_device = "gpu"
embedding_batch_size = 8
max_hits = 5
rerank_enabled = false

[generation]
video_generation_concurrency = 5
summary_chunk_concurrency = 3
chapter_visual_mode = "screenshots"
max_visual_input_images = 10
note_visual_mode = "screenshots"
ai_summary_multimodal_enabled = false
mindmap_visual_input = "none"
cards_visual_input = "none"
note_max_images = 10
note_image_min_gap_seconds = 5.0
auto_generate_artifacts = []

[web_search]
enabled = false
provider = "litellm"
mode = "native"
search_context_size = "medium"
max_results = 5
timeout_seconds = 10

[external_import.chaoxing]
request_delay_seconds = 0.2
init_course_delay_seconds = 0.3
